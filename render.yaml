# Blueprint da Render — web service free + Postgres free.
# O Postgres guarda o ranking quando o web service entra em standby.
# Plano free do banco expira em 30 dias; antes disso, suba para um plano pago se quiser manter os dados.
# https://render.com/docs/blueprint-spec

databases:
  - name: complexo88-hyrox-db
    plan: free
    databaseName: complexo88
    ipAllowList: []

services:
  - type: web
    name: complexo88-hyrox
    runtime: node
    plan: free
    nodeVersion: "22.14.0"
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: complexo88-hyrox-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
